name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: syntax + package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: npm run lint

      - name: Package dry-run
        run: npm pack --dry-run

      - name: Files that would ship
        run: npm pack --dry-run --json | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));for(const f of d[0].files)console.log(f.size.toString().padStart(8),f.path)"
