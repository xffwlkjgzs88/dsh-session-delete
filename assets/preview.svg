<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="界面示意图">
  <defs>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c111b"/>
      <stop offset="100%" stop-color="#0a0e16"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111823"/>
      <stop offset="100%" stop-color="#0d131d"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1000" height="560" fill="url(#app)"/>
  <rect width="300" height="560" fill="url(#side)"/>
  <line x1="300" y1="0" x2="300" y2="560" stroke="#ffffff" stroke-opacity=".07"/>

  <!-- 侧栏头部 -->
  <circle cx="34" cy="34" r="9" fill="none" stroke="#5b8def" stroke-width="1.6"/>
  <text x="52" y="39" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="14" font-weight="600" fill="#e6edf7">会话</text>
  <rect x="252" y="24" width="24" height="24" rx="7" fill="#ffffff" fill-opacity=".06"/>
  <text x="264" y="41" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#8b98ab">+</text>

  <!-- 会话行 -->
  <g font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="13">
    <rect x="12" y="72" width="276" height="38" rx="8" fill="transparent"/>
    <text x="28" y="96" fill="#9aa7b8">重构 workspace registry</text>
    <text x="268" y="96" text-anchor="end" fill="#4a5668">···</text>

    <rect x="12" y="116" width="276" height="38" rx="8" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="28" y="140" fill="#e6edf7">dsh-purge 排错记录</text>
    <text x="236" y="140" text-anchor="end" fill="#5f6c7f">···</text>
    <g transform="translate(268 135)" fill="none" stroke="#ff7b72" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-5 -6v-2.5h10V-6"/>
      <path d="M-10.5 -6H10.5"/>
      <path d="M-8.5 -2.5h17V9a2.5 2.5 0 0 1-2.5 2.5h-12A2.5 2.5 0 0 1-8.5 9z"/>
    </g>

    <rect x="12" y="160" width="276" height="38" rx="8" fill="transparent"/>
    <text x="28" y="184" fill="#9aa7b8">毕业季行李寄递方案</text>
    <text x="268" y="184" text-anchor="end" fill="#4a5668">···</text>

    <rect x="12" y="204" width="276" height="38" rx="8" fill="transparent"/>
    <text x="28" y="228" fill="#9aa7b8">REA 工具链自检</text>
    <text x="268" y="228" text-anchor="end" fill="#4a5668">···</text>

    <rect x="12" y="248" width="276" height="38" rx="8" fill="transparent"/>
    <text x="28" y="272" fill="#9aa7b8">本周课表</text>
    <text x="268" y="272" text-anchor="end" fill="#4a5668">···</text>
  </g>

  <!-- 遮罩 -->
  <rect x="300" y="0" width="700" height="560" fill="#05070c" fill-opacity=".55"/>

  <!-- 对话框 -->
  <g filter="url(#shadow)">
    <rect x="380" y="168" width="440" height="216" rx="14" fill="#1b2130" stroke="#ffffff" stroke-opacity=".13"/>
  </g>

  <g transform="translate(408 199)" fill="none" stroke="#ff7b72" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-5.5 -6.5v-3h11v3"/>
    <path d="M-11.5 -6.5H11.5"/>
    <path d="M-9.5 -2.5h19V10a2.5 2.5 0 0 1-2.5 2.5h-14A2.5 2.5 0 0 1-9.5 10z"/>
  </g>
  <text x="432" y="204" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="15" font-weight="600" fill="#eef3fa">删除会话</text>

  <text x="408" y="242" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#98a4b6">「<tspan fill="#eef3fa">dsh-purge 排错记录</tspan>」将被永久删除：</text>
  <text x="408" y="266" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#98a4b6">对话正文、投影缓存、侧栏记录三处一起清掉，不可恢复。</text>

  <rect x="592" y="330" width="82" height="32" rx="9" fill="transparent" stroke="#ffffff" stroke-opacity=".14"/>
  <text x="633" y="351" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#e6edf7">取消</text>

  <rect x="686" y="330" width="106" height="32" rx="9" fill="#ff7b72" fill-opacity=".14" stroke="#ff7b72" stroke-opacity=".45"/>
  <text x="739" y="351" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="13" font-weight="500" fill="#ff8b83">删除</text>

  <text x="980" y="540" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#3f4a5c">界面示意图 · 非真实截图</text>
</svg>
