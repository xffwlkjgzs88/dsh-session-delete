<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="dsh-session-delete">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060910"/>
      <stop offset="45%" stop-color="#0d1626"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#cfe0ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="22%" stop-color="#3b82f6" stop-opacity="1"/>
      <stop offset="70%" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity=".028" stroke-width="1"/>
    </pattern>
    <style>
      .glowA { animation: driftA 16s ease-in-out infinite; }
      .glowB { animation: driftB 19s ease-in-out infinite; }
      .ring  { animation: breathe 5s ease-in-out infinite; }
      .spark { animation: breathe 3.2s ease-in-out infinite; }
      @keyframes driftA { 0%,100% { transform: translate(0,0) } 50% { transform: translate(46px,-24px) } }
      @keyframes driftB { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-40px,26px) } }
      @keyframes breathe { 0%,100% { opacity:.55 } 50% { opacity:1 } }
      @media (prefers-reduced-motion: reduce) {
        .glowA, .glowB, .ring, .spark { animation: none }
      }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <ellipse class="glowA" cx="210" cy="70" rx="430" ry="280" fill="url(#glowA)"/>
  <ellipse class="glowB" cx="1010" cy="290" rx="420" ry="260" fill="url(#glowB)"/>

  <!-- 图标 -->
  <g>
    <rect class="ring" x="70" y="110" width="100" height="100" rx="26" fill="#0a1220" stroke="url(#ring)" stroke-width="1.6" stroke-opacity=".7"/>
    <g transform="translate(120 160) scale(1.7)" fill="none" stroke="#ff8b83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-4.5 -11v-3h9v3"/>
      <path d="M-13 -11H13"/>
      <path d="M-10 -7h20v15.5a3.5 3.5 0 0 1-3.5 3.5h-13a3.5 3.5 0 0 1-3.5-3.5z"/>
      <path d="M-4 -2.5v10M4 -2.5v10"/>
    </g>
  </g>

  <text x="198" y="172" font-family="'Segoe UI','Microsoft YaHei',system-ui,-apple-system,sans-serif" font-size="54" font-weight="700" fill="url(#text)" letter-spacing="-1.8">dsh-session-delete</text>
  <text x="200" y="212" font-family="'Segoe UI','Microsoft YaHei',system-ui,-apple-system,sans-serif" font-size="19" fill="#8fa0b8">真删会话 · 让宿主的 registry 一起忘掉</text>

  <g font-family="'Segoe UI','Microsoft YaHei',system-ui,-apple-system,sans-serif" font-size="13" fill="#aab6c9">
    <rect x="200" y="240" width="104" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/>
    <text x="252" y="260" text-anchor="middle">MIT 开源</text>
    <rect x="316" y="240" width="96" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/>
    <text x="364" y="260" text-anchor="middle">完全免费</text>
    <rect x="424" y="240" width="118" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/>
    <text x="483" y="260" text-anchor="middle">零依赖</text>
  </g>

  <circle class="spark" cx="1128" cy="128" r="3" fill="#8ab4ff"/>
  <circle class="spark" cx="1096" cy="176" r="2" fill="#a78bfa"/>
  <circle class="spark" cx="1152" cy="196" r="2.4" fill="#60a5fa"/>

  <text x="1150" y="214" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" fill="#4c5c76">{ "ok": true, "freedKB": 48160 }</text>

  <text x="1130" y="300" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13.5" fill="#45536a">github.com/xffwlkjgzs88/dsh-session-delete</text>
  <rect x="0" y="332" width="1200" height="4" fill="url(#rule)"/>
</svg>
